name: Follow Findy releases

# Daily, and on demand: move the manifest to the latest published Findy release.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update.sh
      - name: Commit a new version
        run: |
          git add bucket
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "findy $(jq -r .version bucket/findy.json)"
          git push
